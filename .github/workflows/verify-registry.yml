name: Verify public FluxProof registry entry
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public registry entry without authentication
        run: |
          curl --fail --location --retry 3 --max-time 30 'https://registry.modelcontextprotocol.io/v0.1/servers?search=fluxproof' --output entry.json
          cat entry.json
          version="$(jq -r .version server.json)"
          jq -e --arg version "$version" '.servers[] | select(.server.name == "io.github.equinoxaifinance-rgb/fluxproof") | select(.server.version == $version) | select(.server.remotes[0].url == "https://fluxproof.neoaethel.workers.dev/mcp")' entry.json
          sha256sum entry.json
